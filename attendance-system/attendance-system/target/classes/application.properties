spring.application.name=attendance-system
server.port=8080

# --- Database (create it first with sql/01..03) -------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:attendance_app}
spring.datasource.password=${DB_PASSWORD:change_me}

# The schema comes from the SQL scripts, so Hibernate must NOT create/alter tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- First admin account, created on startup only if no ADMIN exists ----
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.full-name=System Administrator
